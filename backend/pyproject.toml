[project]
name = "jobweaver"
version = "0.1.0"
description = "AI job-hunt assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "pypdf>=4.2",
    "fpdf2>=2.8,<3",
    "dnspython>=2.6,<3",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.documents" = ["fonts/*.ttf", "fonts/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# PEP 695 generics do not play well with pydantic generic models yet.
ignore = ["UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async layer runs code in greenlets.
concurrency = ["greenlet", "thread"]
source = ["app"]
