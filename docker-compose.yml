# Local stack: Postgres with pgvector plus the app, built like production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobweaver
      POSTGRES_PASSWORD: jobweaver
      POSTGRES_DB: jobweaver
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobweaver"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobweaver:jobweaver@postgres:5432/jobweaver
      PUBLIC_URL: http://localhost:8000
    ports: ["8000:8000"]
    # Local recorded-AI responses only; fixtures stay out of the production image.
    volumes:
      - ./backend/tests/fixtures/gateway:/app/tests/fixtures/gateway:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
