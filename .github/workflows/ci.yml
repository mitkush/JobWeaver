name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobweaver
          POSTGRES_PASSWORD: jobweaver
          POSTGRES_DB: jobweaver_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobweaver" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jobweaver:jobweaver@localhost:5432/jobweaver_test
      TEST_DATABASE_URL: postgresql+asyncpg://jobweaver:jobweaver@localhost:5432/jobweaver_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (recorded AI mode, zero live AI calls)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: API types are generated from the current backend
        run: |
          python -m venv ../backend/.venv
          ../backend/.venv/bin/pip install -q -e ../backend
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobweaver .
      - run: docker run --rm --network none --entrypoint python jobweaver -c "import importlib.util; assert importlib.util.find_spec('jobspy') is None"
      - run: docker build --build-arg BACKEND_EXTRAS=jobspy -t jobweaver-jobspy .
      - run: docker run --rm --network none --entrypoint python jobweaver-jobspy -c "from jobspy import scrape_jobs"
