name: Deploy to Oracle

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '92.4.68.22' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require passing CI on the exact main commit
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --event push --commit "$commit" --limit 1 --json conclusion --jq '.[0].conclusion')
          test "$result" = success || { echo 'Main CI must pass before deploying. Run again when it passes.'; exit 1; }
          echo "DEPLOY_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Build production image on GitHub
        run: |
          docker build -t "jobweaver:$DEPLOY_COMMIT" .
          docker save "jobweaver:$DEPLOY_COMMIT" | gzip > "$RUNNER_TEMP/jobweaver-image.tar.gz"
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_oracle ~/.ssh/known_hosts
      - name: Prepare remote deployment directory
        run: |
          set -euo pipefail
          remote_dir="/tmp/jobweaver-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"
          timeout 60s ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "umask 077; mkdir -p '$remote_dir'"
      - name: Configure Piloterr API key
        env:
          PILOTERR_API_KEY: ${{ secrets.PILOTERR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PILOTERR_API_KEY" || { echo 'PILOTERR_API_KEY Actions secret is missing'; exit 1; }
          printf '%s' "$PILOTERR_API_KEY" | timeout 60s ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "python3 -c 'import os,pathlib,stat,sys; p=pathlib.Path(\"/home/ubuntu/JobWeaver/backend/.env\"); key=sys.stdin.read().strip(); assert key, \"empty Piloterr key\"; lines=[line for line in p.read_text().splitlines() if not line.startswith(\"PILOTERR_API_KEY=\")]; lines.append(\"PILOTERR_API_KEY=\"+key); tmp=p.with_name(p.name+\".tmp\"); tmp.write_text(\"\\n\".join(lines)+\"\\n\"); os.chmod(tmp,stat.S_IMODE(p.stat().st_mode)); os.replace(tmp,p)'"
      - name: Upload deployment script
        run: |
          set -euo pipefail
          timeout 90s scp -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            scripts/deploy-oracle.sh "ubuntu@$ORACLE_HOST:$REMOTE_DIR/"
      - name: Upload production image
        run: |
          set -euo pipefail
          timeout 10m scp -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$RUNNER_TEMP/jobweaver-image.tar.gz" "ubuntu@$ORACLE_HOST:$REMOTE_DIR/"
      - name: Run deployment script
        run: |
          set -euo pipefail
          timeout 20m ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "bash '$REMOTE_DIR/deploy-oracle.sh' '$REMOTE_DIR/jobweaver-image.tar.gz' '$DEPLOY_COMMIT'"
      - name: Verify public HTTPS
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 15 https://jobweaver.duckdns.org/health
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_oracle
