name: Deploy to Oracle

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Push the image to GHCR and prune old versions of it.
  packages: write

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST || '92.4.68.22' }}
      GH_TOKEN: ${{ github.token }}
      # GHCR names must be lower case.
      IMAGE: ghcr.io/mitkush/jobweaver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require passing CI on the exact main commit
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --event push --commit "$commit" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [[ "$result" != success ]]; then
            # GitHub may not run push CI on a merge commit. Accept its parent runs only
            # when both passed and the merge added no changes beyond the deploy workflow.
            main_parent=$(git rev-parse "$commit^1" 2>/dev/null || true)
            pr_parent=$(git rev-parse "$commit^2" 2>/dev/null || true)
            if [[ -n "$main_parent" && -n "$pr_parent" ]] && \
              git diff --quiet "$pr_parent" "$commit" -- . ':!.github/workflows/deploy-oracle.yml'; then
              main_result=$(gh run list --workflow ci.yml --event push --commit "$main_parent" --limit 1 --json conclusion --jq '.[0].conclusion')
              pr_result=$(gh run list --workflow ci.yml --event pull_request --commit "$pr_parent" --limit 1 --json conclusion --jq '.[0].conclusion')
              if [[ "$main_result" == success && "$pr_result" == success ]]; then
                result=success
              fi
            fi
          fi
          test "$result" = success || { echo 'Main CI must pass before deploying. Run again when it passes.'; exit 1; }
          echo "DEPLOY_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Optional backend extras, e.g. repository variable BACKEND_EXTRAS=jobspy.
          build-args: BACKEND_EXTRAS=${{ vars.BACKEND_EXTRAS }}
          push: true
          # One version per deploy; no extra untagged attestation versions to clean up.
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.DEPLOY_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_oracle ~/.ssh/known_hosts
      - name: Prepare remote deployment directory
        run: |
          set -euo pipefail
          remote_dir="/tmp/jobweaver-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"
          timeout 60s ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "umask 077; mkdir -p '$remote_dir'"
      - name: Upload deployment script
        run: |
          set -euo pipefail
          timeout 90s scp -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            scripts/deploy-oracle.sh scripts/pull-deploy-image.sh "ubuntu@$ORACLE_HOST:$REMOTE_DIR/"
      - name: Pull production image on Oracle
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_TOKEN" | timeout 22m ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "bash '$REMOTE_DIR/pull-deploy-image.sh' '$IMAGE' '$IMAGE_DIGEST' '$DEPLOY_COMMIT' '$GITHUB_ACTOR'"
      - name: Run deployment script
        run: |
          set -euo pipefail
          timeout 20m ssh -i ~/.ssh/id_oracle \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "bash '$REMOTE_DIR/deploy-oracle.sh' '$DEPLOY_COMMIT'"
      - name: Verify public HTTPS
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 15 https://jobweaver.duckdns.org/health
      - name: Keep only recent images in GHCR
        # Bounds registry storage; never fails a deployment that already succeeded.
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: jobweaver
          package-type: container
          min-versions-to-keep: 5
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_oracle
