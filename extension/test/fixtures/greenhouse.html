<form id="application-form">
  <div><label id="first_name-label" for="first_name">First Name<span>*</span></label><input id="first_name" aria-labelledby="first_name-label" aria-required="true"></div>
  <div><label for="last_name">Last Name</label><input id="last_name"></div>
  <div><label for="email">Email</label><input id="email" type="text"></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div><label for="candidate-location">Location (City)</label><input id="candidate-location" role="combobox"></div>
  <div><label for="resume">Resume/CV</label><input id="resume" type="file" class="visually-hidden"></div>
  <div><label for="cover_letter">Cover Letter</label><input id="cover_letter" type="file"></div>
  <div><label for="question_123">LinkedIn Profile</label><input id="question_123"></div>
  <div><label for="question_456">How did you hear about us?</label><input id="question_456"></div>
  <button type="submit">Submit application</button>
</form>
