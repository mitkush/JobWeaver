<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobWeaver</title>
    <link rel="stylesheet" href="./src/popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">jobweaver // extension</p>
      <h1>JobWeaver</h1>
      <p id="status" role="status">Checking your connection...</p>

    </main>
    <script type="module" src="./src/popup.ts"></script>
  </body>
