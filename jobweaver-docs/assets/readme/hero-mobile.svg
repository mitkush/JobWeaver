<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc"><title id="title">JobWeaver</title><desc id="desc">Find your next role. Bring your own story. Fact-backed, self-hostable applications, always reviewed by you.</desc><defs><radialGradient id="glow"><stop stop-color="#ff238a" stop-opacity=".2"/><stop offset="1" stop-color="#ff238a" stop-opacity="0"/></radialGradient><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".13"/></pattern></defs><rect width="600" height="550" rx="16" fill="#09090f"/><rect width="600" height="550" rx="16" fill="url(#dots)"/><ellipse cx="150" cy="150" rx="400" ry="310" fill="url(#glow)"/><path d="M24 72V24h72M504 526h72v-48" fill="none" stroke="#ff4b9f" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="96" font-size="32" fill="#fff" font-weight="700">JOB<tspan fill="#ff4b9f">WEAVER</tspan></text><text x="48" y="192" font-size="50" fill="#fff" font-weight="700" letter-spacing="-2">Find your next role.</text><text x="48" y="256" font-size="50" fill="#ff4b9f" font-weight="700" letter-spacing="-2">Bring your own story.</text><text x="48" y="316" fill="#bbb8cd" font-size="22">Less scattered searching.</text><text x="48" y="350" fill="#bbb8cd" font-size="22">More thoughtful applications.</text><text x="48" y="432" fill="#81eee7" font-size="17" font-weight="700" letter-spacing="1">FACT-BACKED / SELF-HOSTABLE</text><text x="48" y="474" fill="#aaa6be" font-size="20">Always reviewed by you.</text></g></svg>