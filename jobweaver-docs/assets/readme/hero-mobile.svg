<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc"><title id="title">JobWeaver</title><desc id="desc">Find your next role. Bring your own story. Fact-backed, self-hostable applications, always reviewed by you.</desc><defs><radialGradient id="glow"><stop stop-color="#ff238a" stop-opacity=".2"/><stop offset="1" stop-color="#ff238a" stop-opacity="0"/></radialGradient><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".13"/></pattern><linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-250 0;-250 0;700 0" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/></linearGradient></defs><style>
.corner{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s .2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.tag{animation:glow 3s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.corner{animation:none;stroke-dashoffset:0}.tag{animation:none}.motion{display:none}}
</style><rect width="600" height="550" rx="16" fill="#09090f"/><rect width="600" height="550" rx="16" fill="url(#dots)"/><ellipse cx="150" cy="150" rx="400" ry="310" fill="url(#glow)"/><path class="corner" d="M24 72V24h72M504 526h72v-48" fill="none" stroke="#ff4b9f" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="96" font-size="32" fill="#fff" font-weight="700">JOB<tspan fill="#ff4b9f">WEAVER</tspan></text><text x="48" y="192" font-size="50" fill="#fff" font-weight="700" letter-spacing="-2">Find your next role.</text><text x="48" y="256" font-size="50" fill="#ff4b9f" font-weight="700" letter-spacing="-2">Bring your own story.</text><text class="motion" x="48" y="256" font-size="50" fill="url(#shine)" font-weight="700" letter-spacing="-2">Bring your own story.</text><text x="48" y="316" fill="#bbb8cd" font-size="22">Less scattered searching.</text><text x="48" y="350" fill="#bbb8cd" font-size="22">More thoughtful applications.</text><text class="tag" x="48" y="432" fill="#81eee7" font-size="17" font-weight="700" letter-spacing="1">FACT-BACKED / SELF-HOSTABLE</text><text x="48" y="474" fill="#aaa6be" font-size="20">Always reviewed by you.</text></g></svg>