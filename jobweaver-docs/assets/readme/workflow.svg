<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Discover. Tailor. Apply.</title><desc id="desc">Collect and deduplicate jobs, prepare documents from your reviewed Facts, then review, fill and submit yourself. Track your application afterwards.</desc><rect width="100%" height="100%" rx="16" fill="#0b0b12"/><g transform="translate(24 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path d="M16 1h336" stroke="#ff4b9f" stroke-width="2"/><circle cx="30" cy="38" r="4" fill="#ff4b9f"/><text x="45" y="43" fill="#ff4b9f" font-size="14" font-family="monospace" letter-spacing="2">01 / DISCOVER</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Find the signal.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Collect jobs across sources.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Group duplicate listings.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Keep a personal shortlist.</text></g><g transform="translate(416 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path d="M16 1h336" stroke="#b99bff" stroke-width="2"/><circle cx="30" cy="38" r="4" fill="#b99bff"/><text x="45" y="43" fill="#b99bff" font-size="14" font-family="monospace" letter-spacing="2">02 / TAILOR</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Tell your story.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Start with reviewed Facts.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Prepare role-specific documents.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Inspect, edit and accept changes.</text></g><g transform="translate(808 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path d="M16 1h336" stroke="#50e5dc" stroke-width="2"/><circle cx="30" cy="38" r="4" fill="#50e5dc"/><text x="45" y="43" fill="#50e5dc" font-size="14" font-family="monospace" letter-spacing="2">03 / APPLY</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Stay in control.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Fill only the fields you review.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Send or submit yourself.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Track progress and follow-ups.</text></g></svg>