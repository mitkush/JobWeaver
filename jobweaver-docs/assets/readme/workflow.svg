<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Discover. Tailor. Apply.</title><desc id="desc">Collect and deduplicate jobs, prepare documents from your reviewed Facts, then review, fill and submit yourself. Track your application afterwards.</desc><defs><linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop stop-color="#ff4b9f"/><stop offset=".5" stop-color="#b99bff"/><stop offset="1" stop-color="#50e5dc"/></linearGradient><radialGradient id="spark"><stop stop-color="#fff"/><stop offset=".4" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><path id="weave" d="M50 250C190 232 290 268 404 250S620 232 796 250S1010 268 1150 250"/></defs><style>
.flow{stroke-dasharray:12 10;animation:flow 2.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}
.step .accent{opacity:.35;animation:light 6s ease-in-out infinite}.step .dot{transform-box:fill-box;transform-origin:center;animation:dot 6s ease-in-out infinite}
.s2 .accent,.s2 .dot{animation-delay:2s}.s3 .accent,.s3 .dot{animation-delay:4s}
@keyframes light{0%,40%,100%{opacity:.35}12%,28%{opacity:1}}
@keyframes dot{0%,40%,100%{transform:scale(1)}12%,28%{transform:scale(1.8)}}
@media(prefers-reduced-motion:reduce){.flow,.step .accent,.step .dot{animation:none}.step .accent{opacity:1}.motion{display:none}}
</style><rect width="100%" height="100%" rx="16" fill="#0b0b12"/><g class="step s1" transform="translate(24 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path class="accent" d="M16 1h336" stroke="#ff4b9f" stroke-width="2"/><circle class="dot" cx="30" cy="38" r="4" fill="#ff4b9f"/><text x="45" y="43" fill="#ff4b9f" font-size="14" font-family="monospace" letter-spacing="2">01 / DISCOVER</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Find the signal.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Collect jobs across sources.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Group duplicate listings.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Keep a personal shortlist.</text></g><g class="step s2" transform="translate(416 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path class="accent" d="M16 1h336" stroke="#b99bff" stroke-width="2"/><circle class="dot" cx="30" cy="38" r="4" fill="#b99bff"/><text x="45" y="43" fill="#b99bff" font-size="14" font-family="monospace" letter-spacing="2">02 / TAILOR</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Tell your story.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Start with reviewed Facts.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Prepare role-specific documents.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Inspect, edit and accept changes.</text></g><g class="step s3" transform="translate(808 24)"><rect width="368" height="252" rx="12" fill="#13131e" stroke="#303042"/><path class="accent" d="M16 1h336" stroke="#50e5dc" stroke-width="2"/><circle class="dot" cx="30" cy="38" r="4" fill="#50e5dc"/><text x="45" y="43" fill="#50e5dc" font-size="14" font-family="monospace" letter-spacing="2">03 / APPLY</text><text x="26" y="91" fill="#f4f2ff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Stay in control.</text><text x="26" y="132" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Fill only the fields you review.</text><text x="26" y="160" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Send or submit yourself.</text><text x="26" y="188" fill="#b9b6ce" font-size="17" font-family="Arial,Helvetica,sans-serif">Track progress and follow-ups.</text></g><g fill="none"><use href="#weave" stroke="url(#thread)" stroke-opacity=".28" stroke-width="2"/><use class="flow" href="#weave" stroke="url(#thread)" stroke-width="2"/></g><g class="motion"><circle r="10" fill="url(#spark)"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"><mpath href="#weave"/></animateMotion></circle></g></svg>