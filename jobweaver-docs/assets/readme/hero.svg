<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">JobWeaver - Find your next role. Bring your own story.</title><desc id="desc">Jobs, your experience and a thoughtful application woven into one workflow. Discover, tailor, review and apply.</desc>
<defs><radialGradient id="halo"><stop stop-color="#ff238a" stop-opacity=".17"/><stop offset="1" stop-color="#ff238a" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#ffffff" opacity=".12"/></pattern><linearGradient id="edge"><stop stop-color="#ff238a"/><stop offset="1" stop-color="#50e5dc"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-300 0;-300 0;900 0" keyTimes="0;.55;1" dur="7s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="spark"><stop stop-color="#fff"/><stop offset=".35" stop-color="#ff9ccb"/><stop offset="1" stop-color="#ff4b9f" stop-opacity="0"/></radialGradient><radialGradient id="spark2"><stop stop-color="#fff"/><stop offset=".35" stop-color="#a5f6f0"/><stop offset="1" stop-color="#50e5dc" stop-opacity="0"/></radialGradient>
<path id="pink" d="M839 130C1025 130 895 350 1110 350"/><path id="cyan" d="M839 350C1025 350 895 130 1110 130"/></defs>
<style>
.flow{stroke-dasharray:14 10;animation:flow 2.4s linear infinite}.flow.slow{animation-duration:3.6s;animation-direction:reverse}.mid{animation:flow 5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.float{animation:float 6s ease-in-out infinite}.float.late{animation-delay:-3s}
@keyframes float{50%{transform:translateY(-7px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.pulse.late{animation-delay:-1.2s}
@keyframes pulse{50%{transform:scale(1.7);opacity:.45}}
.corner{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 3s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.flow,.mid,.float,.pulse,.bar{animation:none}.corner{animation:none;stroke-dashoffset:0}.motion{display:none}}
</style>
<rect width="1200" height="480" rx="20" fill="#09090f"/><rect width="1200" height="480" rx="20" fill="url(#grid)"/><ellipse cx="160" cy="190" rx="500" ry="370" fill="url(#halo)"/>
<path class="corner" d="M28 66V28h72M1100 452h72v-38" fill="none" stroke="url(#edge)" stroke-width="2"/>
<g transform="translate(64 64)"><rect width="48" height="48" rx="9" fill="#ff238a"/><g transform="translate(8 8)" fill="none" stroke="#09090f" stroke-width="3"><path d="M4 7h7l10 18h7M4 25h7L21 7h7M4 16h8m8 0h8"/><path d="m14 12 4 8" stroke="#ffd3e5"/></g></g>
<g fill="#f5f4ff" font-family="Arial,Helvetica,sans-serif"><text x="128" y="97" font-size="29" font-weight="700" letter-spacing="-1">JOB<tspan fill="#ff5ea6">WEAVER</tspan></text>
<text x="64" y="190" font-size="62" font-weight="700" letter-spacing="-2.5">Find your next role.</text><text x="64" y="261" font-size="62" font-weight="700" letter-spacing="-2.5" fill="#ff4b9f">Bring your own story.</text>
<text class="motion" x="64" y="261" font-size="62" font-weight="700" letter-spacing="-2.5" fill="url(#shine)">Bring your own story.</text>
<text x="66" y="311" fill="#bbb8cd" font-size="19">Less scattered searching. More thoughtful applications.</text>
<text x="66" y="341" fill="#bbb8cd" font-size="19">Built around your experience. Always reviewed by you.</text></g>
<g font-family="monospace" font-size="12" letter-spacing="1.4"><rect x="64" y="389" width="133" height="32" rx="16" fill="#ff238a" fill-opacity=".12" stroke="#ff238a" stroke-opacity=".45"/><text x="82" y="410" fill="#ff91bf">FACT-BACKED</text><rect x="207" y="389" width="143" height="32" rx="16" fill="#50e5dc" fill-opacity=".08" stroke="#50e5dc" stroke-opacity=".4"/><text x="225" y="410" fill="#81eee7">SELF-HOSTABLE</text><text x="371" y="410" fill="#9d99b1">YOU CLICK SUBMIT.</text></g>
<g fill="none" stroke-width="2.5"><use href="#pink" stroke="#ff4b9f" stroke-opacity=".35"/><use href="#cyan" stroke="#50e5dc" stroke-opacity=".35"/><use class="flow" href="#pink" stroke="#ff4b9f"/><use class="flow slow" href="#cyan" stroke="#50e5dc"/><path class="mid" d="M839 240H1110" stroke="#a596f9" stroke-dasharray="4 9"/></g>
<g class="motion"><circle r="9" fill="url(#spark)"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"><mpath href="#pink"/></animateMotion></circle><circle r="9" fill="url(#spark2)"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"><mpath href="#cyan"/></animateMotion></circle></g>
<g font-family="Arial,Helvetica,sans-serif"><g class="float"><rect x="822" y="109" width="218" height="94" rx="13" fill="#14131e" stroke="#ff4b9f" stroke-opacity=".7"/><text x="841" y="136" fill="#ff91bf" font-size="11" font-weight="700" letter-spacing="2">YOUR EXPERIENCE</text><text x="841" y="167" fill="#f5f4ff" font-size="19" font-weight="700">Facts before claims.</text><rect class="bar" x="842" y="180" width="60" height="4" rx="2" fill="#ff4b9f" fill-opacity=".6"/></g>
<g class="float late"><rect x="855" y="240" width="265" height="117" rx="13" fill="#14131e" stroke="#50e5dc" stroke-opacity=".65"/><text x="875" y="269" fill="#81eee7" font-size="11" font-weight="700" letter-spacing="2">YOUR APPLICATION</text><text x="875" y="300" fill="#f5f4ff" font-size="16" font-weight="700">A draft you can stand behind.</text><text x="875" y="328" fill="#aaa6be" font-size="14">Resume + cover letter + email</text></g></g>
<g fill="#50e5dc"><circle class="pulse" cx="1110" cy="130" r="5"/><circle class="pulse late" cx="839" cy="350" r="5"/></g></svg>
