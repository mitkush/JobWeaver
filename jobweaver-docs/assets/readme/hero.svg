<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">JobWeaver - Find your next role. Bring your own story.</title><desc id="desc">Jobs, your experience and a thoughtful application woven into one workflow. Discover, tailor, review and apply.</desc>
<defs><radialGradient id="halo"><stop stop-color="#ff238a" stop-opacity=".17"/><stop offset="1" stop-color="#ff238a" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#ffffff" opacity=".12"/></pattern><linearGradient id="edge"><stop stop-color="#ff238a"/><stop offset="1" stop-color="#50e5dc"/></linearGradient></defs>
<style>.thread{animation:weave 9s linear infinite}@keyframes weave{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.thread{animation:none;display:none}}</style><rect width="1200" height="480" rx="20" fill="#09090f"/><rect width="1200" height="480" rx="20" fill="url(#grid)"/><ellipse cx="160" cy="190" rx="500" ry="370" fill="url(#halo)"/>
